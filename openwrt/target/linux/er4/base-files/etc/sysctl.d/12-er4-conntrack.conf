# Connection tracking sized for a gigabit router with 1 GB of RAM. The kernel default was
# 7680 entries: unique-tuple UDP through one
# forwarded port filled it in ~3 s and every new LAN connection failed until it drained.
# ~65k entries cost ~20 MB at most; one bucket per entry keeps the hash chains short.
net.netfilter.nf_conntrack_buckets=65536
net.netfilter.nf_conntrack_max=65536
# Unreplied UDP: the kernel default (OpenWrt's 11-nf-conntrack.conf raises it to 60 s)
net.netfilter.nf_conntrack_udp_timeout=30
